# 向量模型相似度门槛的实测题集（evals/thresholds.py）。
#
# notes      一个小知识库：偏重 AI 和编程（像真实的库一样，同一领域的笔记彼此相近），夹几条别的领域
# related    换了说法的问题，和它应该找到的那条笔记的标题
# unrelated  库里没有答案的问题：向量检索不该带回任何笔记
# same       讲同一个概念的两条笔记（名字、写法都不同）：查重应该把它们拿去问模型
# different  相关但不是同一个概念的两条笔记：相似度高也正常，最终由模型判断
notes:
  SFT: 监督微调。用人工写好的指令和回答继续训练预训练模型，模型由此学会按要求作答。
  RLHF: 基于人类反馈的强化学习。人对模型的多个回答排序，训练奖励模型，再用 PPO 优化语言模型。
  RAG: 检索增强生成。先从知识库检索相关片段，拼进提示词，再让模型基于这些资料生成回答。
  LoRA: 低秩适配。冻结原模型权重，只在注意力层旁边加两个小矩阵来训练，显存和存储开销都很小。
  注意力机制: Transformer 的核心。每个词对句子里所有词算相关程度的权重，按权重汇总信息。
  模型蒸馏: 让小模型学习大模型的输出分布，在体积小很多的情况下保留大部分能力。
  提示词工程: 通过写清任务、给示例、分步骤等方式设计输入，让大模型的输出更符合预期。
  向量数据库: 专门存储和检索高维向量的数据库，用 HNSW 等近似最近邻索引在海量向量里快速找相似项。
  动态规划: 把问题拆成重叠的子问题，记录子问题的解避免重复计算，典型例子是背包问题。
  哈希表: 用哈希函数把键映射到数组下标，平均 O(1) 时间完成插入和查找，冲突用链表或开放寻址解决。
  Git 分支: 每个功能在独立分支上开发，互不影响，完成后合并回主分支。
  快速排序: 选基准把数组分成两部分，递归排序，平均时间复杂度 O(n log n)。
  通货膨胀: 物价总水平持续上涨，货币购买力下降，温和的通胀通常伴随经济增长。
  复利: 利息计入本金继续产生利息，时间越长增长越快，年化 7% 大约十年翻一倍。
  诺曼底登陆: 1944 年 6 月 6 日盟军在法国诺曼底海滩登陆，开辟欧洲第二战场。
  光合作用: 植物的叶绿体利用光能，把二氧化碳和水合成葡萄糖并释放氧气。
  红烧肉: 五花肉焯水后炒糖色，加酱油、料酒和水，小火慢炖至软烂收汁。
  虚拟语气: 英语中表示与事实相反的假设，如 If I were you，从句用过去式。

