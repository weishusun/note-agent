same:
  - - 指令微调: 拿成对的「指令 + 标准回答」数据，对基座模型做有监督的继续训练，让它学会遵循指令。
    - SFT: 监督微调，在预训练模型上用人工标注的问答样本再训练，是对齐的第一步。
  - - 检索增强生成: 模型作答前先到外部资料库里查出相关段落，放进上下文，减少胡编。
    - RAG: Retrieval-Augmented Generation，检索加生成两步走，用外部知识补充模型自身的记忆。
  - - 快排: 一种分治排序：挑一个枢轴，小的放左边、大的放右边，两边各自再排。
    - 快速排序: 平均 O(n log n) 的原地排序算法，核心是按基准元素划分数组后递归。
  - - 通胀: 一段时间里物价普遍、持续地上涨，同样的钱买到的东西变少。
    - 通货膨胀: 货币发行超过实际需要导致货币贬值、物价总水平上升的经济现象。
  - - 低秩适配: 微调时不动原有权重，只训练插进去的两个低秩矩阵，参数量少得多。
    - LoRA: Low-Rank Adaptation，一种参数高效微调方法，用低秩分解近似权重的更新量。
  - - 植物的光合作用: 绿色植物在光照下把水和二氧化碳变成有机物，同时放出氧气。
    - 光合作用: 叶绿体吸收光能，经光反应和暗反应合成糖类的过程。
  - - 散列表: 根据键的散列值直接定位存储位置的数据结构，查找平均是常数时间。
    - 哈希表: 用哈希函数把键映射成数组下标来存取数据，需要处理哈希冲突。
  - - 利滚利: 每期的利息并入本金，下一期连同利息一起计息，长期增长呈指数形状。
    - 复利: 按本金加上已累计利息计算新利息的计息方式，与单利相对。

different:
  - - SFT: 监督微调，在预训练模型上用人工标注的问答样本再训练，是对齐的第一步。
    - RLHF: 基于人类反馈的强化学习，先训练奖励模型给回答打分，再用强化学习优化模型。
  - - RAG: 检索增强生成，模型作答前先检索外部资料放进上下文。
    - 向量数据库: 存储高维向量并支持近似最近邻搜索的数据库，常作为 RAG 的检索后端。
  - - 快速排序: 平均 O(n log n) 的原地排序算法，核心是按基准元素划分数组后递归。
    - 归并排序: 把数组对半分开分别排好，再把两个有序数组合并，稳定且总是 O(n log n)。
  - - 通货膨胀: 物价总水平持续上升、货币购买力下降的现象。
    - 通货紧缩: 物价总水平持续下降，常伴随需求不足和经济衰退。
  - - LoRA: 一种参数高效微调方法，只训练插入的低秩矩阵。
    - 模型蒸馏: 用大模型的输出去训练小模型，把能力压缩到更小的模型里。
  - - 光合作用: 植物利用光能把二氧化碳和水合成有机物并释放氧气。
    - 呼吸作用: 生物分解有机物释放能量，消耗氧气并产生二氧化碳。
  - - 哈希表: 用哈希函数把键映射成数组下标来存取数据，平均常数时间。
    - 二叉搜索树: 左子树都比根小、右子树都比根大的二叉树，查找时间与树高成正比。
  - - 复利: 利息并入本金继续计息，长期增长呈指数形状。
    - 单利: 只按最初的本金计算利息，已产生的利息不再计息，增长是线性的。
